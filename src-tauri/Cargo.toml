[package]
name = "namedaemon-desktop"
version = "0.2.0"
description = "NameDaemon desktop app: check .com names in bulk, keep a watchlist and get notified when a status changes."
authors = ["Krasen Slavov"]
license = "MIT"
repository = "https://github.com/namedaemon/namedaemon-desktop"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
